# HomeView on an Echo Show 5 (960x480, landscape) as a bedside screen: no navigation bar, swipe between pages.
# Home is the clock over the calendar with the photo slideshow filling the right half; Controls is a 2x2 grid of
# quadrants with the clock top left; Music, Cameras, Weather and Calendar fill the screen.
# Dashboard URL: /echo-show (the tile on Controls opens /echo-show/music).
#
# Needs:
# - the homeview-echo theme from examples/echo-show-theme.yaml (the quadrant spacing of the Sections views);
# - a kiosk mode that hides the header, so the views get the whole screen;
# - Swipe Navigation (hass-swipe-navigation) for the swipes, set by `swipe_nav` below;
# - a cover group of the four Family Room curtains, cover.family_room_curtains, so one tile opens and closes them all;
# - a folder of photos in Media (media-source://media_source/local/photos here) for the Home slideshow.
#
# Music: when the Echo starts playing (a voice "play X" too), whichever page is showing switches to Music, and a
# minute after it stops there it goes back Home. Home Assistant only loads the cards of the page on screen, so one
# card in every view carries the same `music_page` (written once as &music_page, then *music_page).
#
# Voice: when the Echo hears its wake word, a warm light runs around the screen's edge and a pill at the bottom says
# Listening, Thinking, Responding, on whichever page is showing. The same card in every view carries `voice_overlay`
# (&voice_overlay, then *voice_overlay). Add `transcript: true` to it to show what was heard and the reply instead
# (needs the Echo's dashboard user to be a Home Assistant admin).
#
# Quadrant sizes in the 24-column section: a quadrant is 12 x 4, half a quadrant 6 x 4.
title: Echo Show
swipe_nav:
  wrap: true
  animate: swipe
views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 2
    theme: homeview-echo
    sections:
      - type: grid
        column_span: 2
        cards:
          # top left: the time and date on the wallpaper
          - type: custom:homeview-clock-card
            face: digital
            music_page: &music_page
              entity: media_player.kitchen_display
              path: /echo-show/music
              home_path: /echo-show/home
              return_after: 60
            voice_overlay: &voice_overlay
              satellite: assist_satellite.kitchen_display
            grid_options: { columns: 12, rows: 4 }
          # right half, full height: the photo slideshow
          - type: custom:homeview-photo-card
            media: media-source://media_source/local/photos
            interval: 30
            shuffle: true
            grid_options: { columns: 12, rows: 8 }
          # bottom left: today's events, or what's next once today is done
          - type: custom:homeview-calendar-card
            layout: day
            entities:
              - calendar.personal
              - calendar.work
              - calendar.holidays
              - calendar.birthdays
            grid_options: { columns: 12, rows: 4 }

  - title: Controls
    path: controls
    icon: mdi:toggle-switch
    type: sections
    max_columns: 2
    theme: homeview-echo
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:homeview-clock-card
            face: digital
            music_page: *music_page
            voice_overlay: *voice_overlay
            grid_options: { columns: 12, rows: 4 }
          # top right: what the Echo plays (tap for the Music page) and the front door
          - type: custom:homeview-tile-card
            entity: media_player.kitchen_display
            name: Echo Show
            tap_action: navigate
            navigation_path: /echo-show/music
            grid_options: { columns: 6, rows: 4 }
          - type: custom:homeview-tile-card
            entity: lock.front_door
            name: Front Door
            subtitle: Lock
            confirm_unlock: true
            grid_options: { columns: 6, rows: 4 }
          # bottom left: the weather, without the time (the clock is above it)
          - type: custom:homeview-weather-card
            entity: weather.home
            show_time: false
            grid_options: { columns: 12, rows: 4 }
          # bottom right: the vacuum and all four Family Room curtains in one tile
          - type: custom:homeview-vacuum-card
            entity: vacuum.robot
            name: Vacuum
            modes:
              - select.robot_cleaning_mode
              - select.robot_mop_mode
              - select.robot_mop_intensity
            grid_options: { columns: 6, rows: 4 }
          - type: custom:homeview-tile-card
            entity: cover.family_room_curtains
            name: Curtains
            subtitle: Family Room
            grid_options: { columns: 6, rows: 4 }

  - title: Music
    path: music
    icon: mdi:music
    type: panel
    cards:
      # Now Playing on the Echo's own speaker
      - type: custom:homeview-media-card
        entity: media_player.kitchen_display
        name: Echo Show
        navigation_path: /echo-show/home
        music_page: *music_page
        voice_overlay: *voice_overlay

  - title: Cameras
    path: cameras
    icon: mdi:cctv
    type: panel
    cards:
      # one live camera edge to edge; swipe for the next
      - type: custom:homeview-camera-card
        home_path: /echo-show/home
        music_page: *music_page
        voice_overlay: *voice_overlay
        crop_top: 7           # every camera: hides the burned-in timestamp
        entities:
          - entity: camera.front_door
            name: Front Door
          - entity: camera.backyard_dome
            name: Backyard Dome
          - entity: camera.backyard
            name: Backyard
          - entity: camera.garage
            name: Garage

  - title: Weather
    path: weather
    icon: mdi:weather-partly-cloudy
    type: panel
    cards:
      - type: custom:homeview-weather-card
        entity: weather.home
        forecast_days: 4
        music_page: *music_page
        voice_overlay: *voice_overlay

  - title: Calendar
    path: calendar
    icon: mdi:calendar
    type: panel
    cards:
      - type: custom:homeview-calendar-card
        layout: list
        days: 14
        music_page: *music_page
        voice_overlay: *voice_overlay
        entities:
          - calendar.personal
          - calendar.work
          - calendar.holidays
          - calendar.birthdays
